<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saarthi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f6f4ef;--card:#fff;--gold:#f4b400;--line:#d9d5c8;--ok:#1b6b3a}
@media (prefers-color-scheme:dark){:root{--ink:#f6f4ef;--paper:#10182b;--card:#1a2542;--line:#34426b}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.5 Hind,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;margin:0 0 4px}
.sub{margin:0 0 20px;opacity:.8}
label{font-weight:600;display:block;margin:16px 0 6px}
select,button{font:inherit;color:inherit}
select{width:100%;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--card)}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.modes button{padding:10px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--card);cursor:pointer}
.modes button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.capture{display:block;width:100%;margin:24px 0;padding:28px 12px;font-size:1.5rem;font-weight:700;text-align:center;
 background:var(--gold);color:#14213d;border:3px solid var(--ink);border-radius:20px;cursor:pointer}
#preview{display:none;width:100%;max-height:260px;object-fit:contain;border-radius:12px;border:2px solid var(--line);background:#000}
#result{display:none;margin-top:20px;padding:18px;background:var(--card);border:2px solid var(--line);border-radius:16px}
#text{white-space:pre-wrap;font-size:1.25rem;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1;min-width:140px;padding:14px;font-weight:600;border:2px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer}
#mic.live{background:#c62828;color:#fff;border-color:#c62828}
#status{min-height:1.5em;margin-top:12px;font-weight:600}
.you{opacity:.75;font-size:1rem;margin:0 0 6px}
.alt{margin:0 0 12px}.alt summary{cursor:pointer;font-weight:600}
textarea{width:100%;margin:8px 0;padding:12px;font:inherit;color:inherit;border:2px solid var(--ink);border-radius:10px;background:var(--card)}
#go{padding:12px 20px;font-weight:600;border:2px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer}
#badge{display:none;color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;margin:0 0 8px}
#ttl{font-size:1.4rem;margin:0 0 8px}
#facts{margin:0 0 14px}#facts div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
#hwrap{margin-top:28px}#hwrap h2{font-size:1.1rem}
button:focus-visible,select:focus-visible{outline:4px solid #1a73e8;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Saarthi</h1>
  <p class="sub">Show me a bill, medicine or letter. I will explain it.</p>

  <label for="lang">Language</label>
  <select id="lang">
    <option value="Hindi|hi-IN">हिन्दी (Hindi)</option>
    <option value="English|en-IN">English</option>
    <option value="Bengali|bn-IN">বাংলা (Bengali)</option>
    <option value="Tamil|ta-IN">தமிழ் (Tamil)</option>
    <option value="Telugu|te-IN">తెలుగు (Telugu)</option>
    <option value="Marathi|mr-IN">मराठी (Marathi)</option>
    <option value="Gujarati|gu-IN">ગુજરાતી (Gujarati)</option>
    <option value="Kannada|kn-IN">ಕನ್ನಡ (Kannada)</option>
  </select>

  <label id="mlabel">What is it?</label>
  <div class="modes" role="group" aria-labelledby="mlabel" id="modes">
    <button data-m="auto" aria-pressed="true">Not sure</button>
    <button data-m="medicine" aria-pressed="false">Medicine</button>
    <button data-m="bill" aria-pressed="false">Bill</button>
    <button data-m="notice" aria-pressed="false">Letter</button>
    <button data-m="scam" aria-pressed="false">Check for scam</button>
  </div>

  <button class="capture" id="snap">Take a photo</button>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>
  <img id="preview" alt="Your photo">
  <details class="alt"><summary>No camera? Type or paste a message</summary>
    <textarea id="msg" rows="4" placeholder="Paste an SMS or letter text here"></textarea>
    <button id="go">Explain this</button></details>
  <div id="status" role="status" aria-live="polite"></div>

  <section id="result" aria-live="polite">
    <p class="you" id="you"></p>
    <span id="badge"></span>
    <h2 id="ttl"></h2>
    <div id="facts"></div>
    <p id="text"></p>
    <div class="row">
      <button id="listen">Listen again</button>
      <button id="mic">Ask a question</button>
      <button id="wa">Share on WhatsApp</button>
      <button id="remind" hidden>Add due date to calendar</button>
    </div>
  </section>
  <section id="hwrap" hidden><h2>Earlier scans</h2><div class="modes" id="hist"></div></section>
</main>

<script>
const $ = id => document.getElementById(id);
let mode = "auto", context = "", recog = null;
const lang = () => { const [name, code] = $("lang").value.split("|"); return {name, code}; };

$("modes").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.m;
  document.querySelectorAll("#modes button").forEach(x => x.setAttribute("aria-pressed", x === b));
};
$("snap").onclick = () => $("file").click();

function shrink(file, max = 1280) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b), "image/jpeg", 0.85);
    };
    img.src = URL.createObjectURL(file);
  });
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang().code; u.rate = 0.9;
  speechSynthesis.speak(u);
}

let last = null;
const RISK = {safe: ["Looks safe", "#1b6b3a"], caution: ["Be careful", "#b26a00"], danger: ["Possible scam or danger", "#c62828"]};
const HK = "saarthi_hist";
const hist = () => { try { return JSON.parse(localStorage.getItem(HK)) || []; } catch { return []; } };
function save(d) {
  if (!d.title) return;
  try { localStorage.setItem(HK, JSON.stringify([d, ...hist().filter(x => x.spoken !== d.spoken)].slice(0, 8))); } catch {}
  drawHist();
}
function drawHist() {
  const h = hist(); $("hist").innerHTML = ""; $("hwrap").hidden = !h.length;
  h.forEach(d => { const b = document.createElement("button"); b.textContent = d.title;
    b.onclick = () => { context = d.spoken; show(d); }; $("hist").append(b); });
}
function show(d, you = "") {
  last = d.title ? d : last || d;
  $("result").style.display = "block";
  $("you").textContent = you; $("text").textContent = d.spoken;
  const bd = $("badge"), r = RISK[d.risk];
  bd.style.display = r ? "inline-block" : "none";
  if (r) { bd.textContent = r[0]; bd.style.background = r[1]; }
  $("ttl").textContent = d.title || "";
  $("facts").innerHTML = "";
  (d.facts || []).forEach(f => { const row = document.createElement("div");
    row.innerHTML = "<b></b><span></span>"; row.children[0].textContent = f.label;
    row.children[1].textContent = f.value; $("facts").append(row); });
  $("remind").hidden = !d.due_date;
  speak(d.spoken); save(d);
  $("result").scrollIntoView({behavior: "smooth"});
}

async function post(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Something went wrong");
  return r.json();
}

async function run(fd) {
  $("status").textContent = "Reading… please wait.";
  fd.append("language", lang().name); fd.append("mode", mode);
  try {
    const d = await post("/api/explain", {method: "POST", body: fd});
    context = d.spoken; $("status").textContent = ""; show(d);
  } catch (err) { $("status").textContent = "Could not read it. " + err.message; }
}
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("preview").src = URL.createObjectURL(f); $("preview").style.display = "block";
  const fd = new FormData(); fd.append("image", await shrink(f), "photo.jpg");
  e.target.value = ""; run(fd);
};
$("go").onclick = () => {
  const t = $("msg").value.trim(); if (!t) return;
  const fd = new FormData(); fd.append("text", t); run(fd);
};
$("wa").onclick = () => {
  if (!last) return;
  const f = (last.facts || []).map(x => x.label + ": " + x.value).join("\n");
  window.open("https://wa.me/?text=" + encodeURIComponent((last.title ? last.title + "\n" : "") + f + "\n\n" + last.spoken + "\n\nExplained by Saarthi"), "_blank");
};
$("remind").onclick = () => {
  if (!last || !last.due_date) return;
  const d = last.due_date.replace(/-/g, ""), now = new Date().toISOString().replace(/[-:]|\.\d+/g, "");
  const ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:" + Date.now() + "@saarthi\r\nDTSTAMP:" + now +
    "\r\nDTSTART;VALUE=DATE:" + d + "\r\nSUMMARY:" + (last.title || "Due date") + " (Saarthi)\r\nEND:VEVENT\r\nEND:VCALENDAR";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type: "text/calendar"})); a.download = "reminder.ics"; a.click();
};

$("listen").onclick = () => speak($("text").textContent);

$("mic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("status").textContent = "Voice questions need Chrome or Edge."; return; }
  if (recog) { recog.stop(); return; }
  speechSynthesis.cancel();
  recog = new SR(); recog.lang = lang().code;
  $("mic").classList.add("live"); $("mic").textContent = "Listening… tap to stop";
  recog.onresult = async ev => {
    const q = ev.results[0][0].transcript;
    $("status").textContent = "Thinking…";
    try {
      const d = await post("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question: q, context, language: lang().name, mode})});
      $("status").textContent = ""; show({spoken: d.text}, "You asked: " + q);
    } catch (err) { $("status").textContent = err.message; }
  };
  recog.onend = () => { recog = null; $("mic").classList.remove("live"); $("mic").textContent = "Ask a question"; };
  recog.start();
};
drawHist();
</script>
</body>
</html>
